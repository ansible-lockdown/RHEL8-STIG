---
dependency:
  name: galaxy
  options:
    requirements-file: collections/requirements.yml
driver:
  name: docker
platforms:
  - name: rhel8-stig-qa
    image: rockylinux/rockylinux:8-ubi-init
    # The image is multi-arch. Default keeps local Apple Silicon runs on arm64;
    # CI exports MOLECULE_DOCKER_PLATFORM=linux/amd64 for GitHub-hosted runners.
    platform: "${MOLECULE_DOCKER_PLATFORM:-linux/arm64}"
    pre_build_image: true
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN
provisioner:
  name: ansible
  log: true
  config_options:
    defaults:
      callbacks_enabled: profile_tasks,timer
  inventory:
    host_vars:
      rhel8-stig-qa:
        ansible_become: false
        ansible_python_interpreter: /usr/libexec/platform-python
        setup_audit: true
        run_audit: true
        # audit_git_version intentionally omitted: vars/audit.yml derives it from
        # benchmark_version via include_vars (which outranks play/host vars), so a
        # value here is inert. Pin a QA branch at run time with:
        #   molecule converge -- --extra-vars 'audit_git_version=<branch>'
        skip_reboot: true
        system_is_container: true
        # Override role default (`false` in defaults/main.yml) - safe in this
        # throwaway container, exercises the full disruption_high code paths.
        rhel8stig_disruption_high: true
        fetch_audit_output: true
        # Files land one level above the role repo (working dir root), e.g.
        # `<working_dir>/_temp_fetched_audits/`. Override with `-e audit_output_destination=...`
        # if you want them somewhere else.
        audit_output_destination: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../_temp_fetched_audits/"
verifier:
  name: ansible
