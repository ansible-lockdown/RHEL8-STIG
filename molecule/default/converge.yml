---

- name: Converge - apply RHEL 8 STIG remediation
  hosts: all
  any_errors_fatal: true
  vars:
    setup_audit: true
    run_audit: true
    # audit_git_version intentionally omitted: tasks/prelim.yml include_vars-es
    # vars/audit.yml, which derives it from benchmark_version and outranks play vars,
    # so a value here is inert. Pin a QA branch at run time with:
    #   molecule converge -- --extra-vars 'audit_git_version=<branch>'
    system_is_container: true
    skip_reboot: true
    # Molecule default - overrides role default (`false`) to exercise full code path
    rhel8stig_disruption_high: true
    fetch_audit_output: true
    audit_output_destination: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../_temp_fetched_audits/"
  pre_tasks:
    - name: Set root password so PAM rules don't lock us out
      ansible.builtin.user:
        name: root
        password: "{{ 'changeme123!' | password_hash('sha512') }}"
  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
