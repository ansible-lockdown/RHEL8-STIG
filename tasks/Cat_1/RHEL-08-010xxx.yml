---

- name: "HIGH | RHEL-08-010000 | AUDIT | The RHEL 8 must be a vendor-supported release."
  when: rhel8stig_010000
  tags:
    - RHEL-08-010000
    - CAT1
    - CCI-000366
    - NIST800-53R4_CM-6
    - SRG-OS-000480-GPOS-00227
    - SV-230221r1017040_rule
    - V-230221
  ansible.builtin.debug:
    msg: Minimum supported version of {{ ansible_facts['distribution'] }} is {{ rhel8stig_min_supported_os_ver[ansible_facts['distribution']] }}
  changed_when: ansible_facts['distribution_version'] is not version_compare(rhel8stig_min_supported_os_ver[ansible_facts['distribution']], '>=')

- name: "HIGH | RHEL-08-010015 | PATCH | RHEL 8 must have the crypto-policies package installed."
  when: rhel8stig_010015
  tags:
    - RHEL-08-010015
    - CAT1
    - CCI-002450
    - NIST800-53R4_SC-13
    - SRG-OS-000396-GPOS-00176
    - SRG-OS-000393-GPOS-00173
    - SRG-OS-000394-GPOS-00174
    - SV-279933r1156352_rule
    - V-279933
  ansible.builtin.package:
    name: crypto-policies
    state: present

- name: "HIGH | RHEL-08-010020 | PATCH | RHEL 8 must implement a FIPS 140-3-compliant systemwide cryptographic policy."
  when: rhel8stig_010020
  tags:
    - RHEL-08-010020
    - CAT1
    - CCI-000068
    - NIST800-53R4_AC-17
    - SRG-OS-000033-GPOS-00014
    - SRG-OS-000125-GPOS-00065
    - SRG-OS-000396-GPOS-00176
    - SRG-OS-000423-GPOS-00187
    - SRG-OS-000478-GPOS-00223
    - SRG-OS-000393-GPOS-00173
    - SRG-OS-000394-GPOS-00174
    - SV-230223r1155356_rule
    - V-230223
  block:
    - name: "HIGH | RHEL-08-010020 | AUDIT | RHEL 8 must implement a FIPS 140-3-compliant systemwide cryptographic policy. | Check FIPS"
      ansible.builtin.command: update-crypto-policies --show
      changed_when: false
      check_mode: false
      failed_when: discovered_crypto_policies_status_show.rc not in [0, 1]
      register: discovered_crypto_policies_status_show

    - name: "HIGH | RHEL-08-010020 | AUDIT | RHEL 8 must implement a FIPS 140-3-compliant systemwide cryptographic policy. | Check FIPS mode on kernel"
      ansible.builtin.command: grep -Ew 'min_rsa_size|hash ' /etc/crypto-policies/state/CURRENT.pol
      changed_when: false
      check_mode: false
      failed_when: discovered_fips_current_policy_status.rc not in [0, 1]
      register: discovered_fips_current_policy_status

    - name: "HIGH | RHEL-08-010020 | PATCH | RHEL 8 must implement a FIPS 140-3-compliant systemwide cryptographic policy. | Add STIG pmod files"
      ansible.builtin.template:
        src: "etc/crypto-policies/policies/modules/STIG.pmod.j2"
        dest: "/etc/crypto-policies/policies/modules/STIG.pmod"
        owner: root
        group: root
        mode: 'u-x,go-rwx'

    - name: "HIGH | RHEL-08-010020 | PATCH | RHEL 8 must implement a FIPS 140-3-compliant systemwide cryptographic policy. | Enable FIPS mode on kernel"
      when: "'FIPS' not in discovered_crypto_policies_status_show.stdout"
      ansible.builtin.command: update-crypto-policies --set FIPS:STIG
      changed_when: false
      check_mode: false
      register: discovered_fips_status
      notify: Change_requires_reboot

- name: "HIGH | RHEL-08-010030 | AUDIT | All RHEL 8 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection."
  when: rhel8stig_010030
  tags:
    - RHEL-08-010030
    - CAT1
    - CCI-001199
    - NIST800-53R4_SC-28
    - SRG-OS-000185-GPOS-00079
    - SRG-OS-000404-GPOS-00183
    - SRG-OS-000405-GPOS-00184
    - SV-230224r1044787_rule
    - V-230224
  vars:
    warn_control_id: "HIGH | RHEL-08-010030"
  block:
    - name: "HIGH | RHEL-08-010030 | AUDIT | All RHEL 8 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection. | Get partition layout"
      ansible.builtin.shell: |
        set -o pipefail
        lsblk  | grep -Ev "boot|crypto_LUKS"
      args:
        executable: "{{ rhel8stig_shell_executable }}"
      changed_when: false
      check_mode: false
      failed_when: false
      register: discovered_partition_layout

    - name: "HIGH | RHEL-08-010030 | AUDIT | All RHEL 8 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection. | Message out warning"
      when: discovered_partition_layout.stdout | length > 0
      ansible.builtin.debug:
        msg:
          - 'WARNING!! Below is the partition layout. Please run the "sudo more /etc/crypttab" command to confirm every persistent disk partition has an entry.'
          - "If partitions other than pseudo file systems (such as /var or /sys) this is a finding"
          - "{{ discovered_partition_layout.stdout_lines }}"

    - name: "HIGH | RHEL-08-010030 | AUDIT | All RHEL 8 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection. | Message out warning"
      when: discovered_partition_layout.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: "HIGH | RHEL-08-010121 | PATCH | The RHEL 8 operating system must not have accounts configured with blank or null passwords."
  when: rhel8stig_010121
  tags:
    - RHEL-08-010121
    - CAT1
    - CCI-000366
    - NIST800-53R4_CM-6
    - SRG-OS-000480-GPOS-00227
    - SV-251706r1017359_rule
    - V-251706
  vars:
    warn_control_id: "HIGH | RHEL-08-010121"
  block:
    - name: "HIGH | RHEL-08-010121 | AUDIT | The RHEL 8 operating system must not have accounts configured with blank or null passwords. | Get users with no pw set"
      ansible.builtin.shell: |
        set -o pipefail
        awk -F: '!$2 {print $1}' /etc/shadow
      args:
        executable: "{{ rhel8stig_shell_executable }}"
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true
      register: discovered_no_pw_users

    - name: "HIGH | RHEL-08-010121 | PATCH | The RHEL 8 operating system must not have accounts configured with blank or null passwords. | Warn on accounts with no passwords"
      when:
        - discovered_no_pw_users.stdout | length > 0
        - not rhel8stig_disruption_high
      ansible.builtin.debug:
        msg:
          - "WARNING!! You have users that are not using passwords. Please either set a password, lock, or remove the accounts below:"
          - "{{ discovered_no_pw_users.stdout_lines }}"

    - name: "HIGH | RHEL-08-010121 | PATCH | The RHEL 8 operating system must not have accounts configured with blank or null passwords. | Warn on accounts with no passwords"
      when:
        - discovered_no_pw_users.stdout | length > 0
        - not rhel8stig_disruption_high
      ansible.builtin.import_tasks:
        file: warning_facts.yml

    - name: "HIGH | RHEL-08-010121 | PATCH | The RHEL 8 operating system must not have accounts configured with blank or null passwords. | Lock accounts with no passwords, disruptive"
      when:
        - discovered_no_pw_users.stdout | length > 0
        - rhel8stig_disruption_high
      ansible.builtin.user:
        name: "{{ item }}"
        password_lock: true
      loop: "{{ discovered_no_pw_users.stdout_lines }}"

- name: |
        "HIGH | RHEL-08-010140 | PATCH | RHEL 8 operating systems booted with United Extensible Firmware Interface (UEFI) implemented must require authentication upon booting into single-user mode and maintenance."
        "HIGH | RHEL-08-010150 | PATCH | RHEL 8 operating systems booted with a BIOS must require authentication upon booting into single-user and maintenance modes."
  when:
    - not system_is_ec2
    - rhel8stig_010140 or
      rhel8stig_010150
  tags:
    - RHEL-08-010140
    - RHEL-08-010150
    - CAT1
    - CCI-000213
    - NIST800-53R4_AC-3
    - SRG-OS-000080-GPOS-00048
    - SV-230234r1137691_rule
    - SV-230235r1137691_rule
    - V-230234
    - V-230235
    - grub
    - bootloader
  ansible.builtin.lineinfile:
    path: "{{ prelim_bootloader_path }}/user.cfg"
    create: true
    regexp: ^GRUB2_PASSWORD=
    line: "GRUB2_PASSWORD={{ rhel8stig_bootloader_password_hash }}"
    owner: root
    group: root
    mode: 'u-x,g-wx,o-rwx'
  notify: Make grub2 config

- name: "HIGH | RHEL-08-010270 | PATCH | RHEL 8 cryptographic policy must not be overridden."
  when:
    - rhel8stig_010270
    - rhel8stig_disruption_high
  tags:
    - RHEL-08-010270
    - CAT1
    - CCI-002450
    - NIST800-53R4_SC-13
    - SRG-OS-000396-GPOS-00176
    - SRG-OS-000393-GPOS-00173
    - SRG-OS-000394-GPOS-00174
    - SV-279932r1156349_rule
    - V-279932
  block:
    - name: "HIGH | RHEL-08-010270 | AUDIT | RHEL 8 cryptographic policy must not be overridden. | Check FIPS"
      ansible.builtin.command: update-crypto-policies --is-applied
      changed_when: false
      check_mode: false
      failed_when: discovered_crypto_policies_status_applied.rc not in [0, 1]
      register: discovered_crypto_policies_status_applied

    - name: "HIGH | RHEL-08-010270 | AUDIT | RHEL 8 cryptographic policy must not be overridden. | Add to reinstall"
      when: "'policy is applied' not in discovered_crypto_policies_status_applied.stdout"
      ansible.builtin.debug:
        msg: 'WARNING!! FIPS policy is not applied - running as handler to reinstall crypto-policies'
      changed_when: true
      notify: Reinstall_crypto_policies

- name: "HIGH | RHEL-08-010370 | PATCH | RHEL 8 must prevent the installation of software, patches, service packs, device drivers, or operating system components from a repository without verification they have been digitally signed using a certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization."
  when: rhel8stig_010370
  tags:
    - RHEL-08-010370
    - CAT1
    - CCI-001749
    - NIST800-53R4_CM-5
    - SRG-OS-000366-GPOS-00153
    - SV-230264r1017377_rule
    - V-230264
    - yum
  block:
    - name: "HIGH | RHEL-08-010370 | PATCH | RHEL 8 must prevent the installation of software, patches, service packs, device drivers, or operating system components from a repository without verification they have been digitally signed using a certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization. | Dnf Default"
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: '^gpgcheck='
        line: gpgcheck=1

    - name: "HIGH | RHEL-08-010370 | AUDIT | RHEL 8 must prevent the installation of software, patches, service packs, device drivers, or operating system components from a repository without verification they have been digitally signed using a certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization. | Gather Repos"
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        pattern: '*.repo'
      register: discovered_repos_list

    - name: "HIGH | RHEL-08-010370 | PATCH | RHEL 8 must prevent the installation of software, patches, service packs, device drivers, or operating system components from a repository without verification they have been digitally signed using a certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization. | Set gpgcheck"
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^gpgcheck'
        line: gpgcheck=1
      loop: "{{ discovered_repos_list.files | map(attribute='path') | flatten }}"

- name: "HIGH | RHEL-08-010371 | PATCH | RHEL 8 must prevent the installation of software, patches, service packs, device drivers, or operating system components of local packages without verification they have been digitally signed using a certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization."
  when: rhel8stig_010371
  tags:
    - RHEL-08-010371
    - CAT1
    - CCI-001749
    - NIST800-53R4_CM-5
    - SRG-OS-000366-GPOS-00153
    - SV-230265r1208742_rule
    - V-230265
    - dnf
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^localpkg_gpgcheck='
    line: localpkg_gpgcheck=1

- name: "HIGH | RHEL-08-010460 | PATCH | There must be no shosts.equiv files on the RHEL 8 operating system."
  when: rhel8stig_010460
  tags:
    - RHEL-08-010460
    - CAT1
    - CCI-000366
    - NIST800-53R4_CM-6
    - SRG-OS-000480-GPOS-00227
    - SV-230283r1017094_rule
    - V-230283
    - shosts
  ansible.builtin.file:
    path: /etc/ssh/shosts.equiv
    state: absent

- name: "HIGH | RHEL-08-010470 | PATCH | There must be no .shosts files on the RHEL 8 operating system."
  when: rhel8stig_010470
  tags:
    - RHEL-08-010470
    - CAT1
    - CCI-000366
    - NIST800-53R4_CM-6
    - SRG-OS-000480-GPOS-00227
    - SV-230284r1017095_rule
    - V-230284
    - shosts
  block:
    - name: "HIGH | RHEL-08-010470 | AUDIT | There must be no .shosts files on the RHEL 8 operating system. | Find .shosts files"
      ansible.builtin.command: find / -name "*.shosts"
      changed_when: false
      check_mode: false
      failed_when: discovered_shost_file_list.rc not in [ 0, 1 ]
      register: discovered_shost_file_list

    - name: "HIGH | RHEL-08-010470 | PATCH | There must be no .shosts files on the RHEL 8 operating system. | Remove .shosts files"
      when: discovered_shost_file_list.stdout | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ discovered_shost_file_list.stdout_lines }}"

- name: "HIGH | RHEL-08-010820 | PATCH | Unattended or automatic logon via the RHEL 8 graphical user interface must not be allowed."
  when:
    - rhel8stig_gui
    - rhel8stig_010820
  tags:
    - RHEL-08-010820
    - CAT1
    - CCI-000366
    - NIST800-53R4_CM-6
    - SRG-OS-000480-GPOS-00229
    - SV-230329r1017140_rule
    - V-230329
  ansible.builtin.lineinfile:
    path: /etc/gdm/custom.conf
    regexp: (?i)automaticloginenable
    line: AutomaticLoginEnable=false
    insertafter: '\[daemon\]'

- name: "HIGH | RHEL-08-010275 | PATCH | RHEL 8 must implement DOD-approved encryption in the bind package."
  when:
    - rhel8stig_010275
    - rhel8stig_disruption_high
    - "'bind' in ansible_facts['packages']"
  tags:
    - RHEL-08-010275
    - CAT1
    - CCI-002418
    - NIST800-53R4_SC-8
    - SRG-OS-000423-GPOS-00187
    - SRG-OS-000426-GPOS-00190
    - SV-279931r1184237_rule
    - V-279931
    - bind
    - encryption
  community.general.ini_file:
    path: /etc/named.conf
    section: options
    option: include
    value: "/etc/crypto-policies/back-ends/bind.config"
    state: present
    owner: root
    group: root
    mode: 'u-x,g-wx,o-rwx'

- name: "HIGH | RHEL-08-010280 | PATCH | RHEL 8 IP tunnels must use FIPS 140-3-approved cryptographic algorithms."
  when:
    - rhel8stig_010280
    - rhel8stig_disruption_high
    - "'libreswan' in ansible_facts['packages']"
  tags:
    - RHEL-08-010280
    - CAT1
    - CCI-000068
    - NIST800-53R4_AC-17
    - SRG-OS-000033-GPOS-00014
    - SV-279930r1184239_rule
    - V-279930
    - fips
    - tunnel
  ansible.builtin.lineinfile:
    path: /etc/ipsec.conf
    regexp: ^(#|)\s*include /etc/crypto-policies/back-ends
    line: include /etc/crypto-policies/back-ends/libreswan.config

- name: "HIGH | RHEL-08-010290 | PATCH | The RHEL 8 SSH daemon must be configured to use only Message Authentication Codes (MACs) employing FIPS 140-2 validated cryptographic hash algorithms. | Add MACs"
  when: rhel8stig_010290
  tags:
    - CAT1
    - RHEL-08-010290
    - CCI-001453
    - NIST800-53R4_AC-17
    - SRG-OS-000250-GPOS-00093
    - SRG-OS-000393-GPOS-00173
    - SRG-OS-000394-GPOS-00174
    - SRG-OS-000125-GPOS-00065
    - SV-230251r1184240_rule
    - V-230251
    - fips
    - sshd
  block:
    - name: "HIGH | RHEL-08-010290 | AUDIT | The RHEL 8 SSH daemon must be configured to use only Message Authentication Codes (MACs) employing FIPS 140-2 validated cryptographic hash algorithms. | get MACs"
      ansible.builtin.shell: |
        set -o pipefail
        grep "^CRYPTO_POLICY" /etc/crypto-policies/back-ends/opensshserver.config | cut -d "'" -f2 | sed s'/ /\n/g' | grep -i MACs | sed s'/-o//g'
      args:
        executable: "{{ rhel8stig_shell_executable }}"
      changed_when: false
      check_mode: false
      failed_when: discovered_current_macs.rc not in [ 0, 1 ]
      register: discovered_current_macs

    - name: "HIGH | RHEL-08-010290 | PATCH | The RHEL 8 SSH daemon must be configured to use only Message Authentication Codes (MACs) employing FIPS 140-2 validated cryptographic hash algorithms. | get MACs"
      ansible.builtin.lineinfile:
        path: /etc/crypto-policies/back-ends/opensshserver.config
        regexp: '(^CRYPTO_POLICY=.*)-oMACS={{ discovered_current_macs.stdout }}(.*$)'
        line: '\g<1>-oMACS={{ rhel8stig_ssh_macs }}\g<2>'
        backrefs: true
      notify: Reinstall_crypto_policies

- name: "HIGH | RHEL-08-010291 | PATCH | The RHEL 8 SSH server must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH server connections. | Add Ciphers"
  when: rhel8stig_010291
  tags:
    - CAT1
    - RHEL-08-010291
    - CCI-001453
    - NIST800-53R4_AC-17
    - SRG-OS-000250-GPOS-00093
    - SRG-OS-000393-GPOS-00173
    - SRG-OS-000394-GPOS-00174
    - SRG-OS-000125-GPOS-00065
    - SV-230252r1184241_rule
    - V-230252
    - fips
    - sshd
  block:
    - name: "HIGH | RHEL-08-010291 | AUDIT | The RHEL 8 SSH server must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH server connections. | get Ciphers"
      ansible.builtin.shell: |
        set -o pipefail
        grep "^CRYPTO_POLICY" /etc/crypto-policies/back-ends/opensshserver.config | cut -d "'" -f2 | sed s'/ /\n/g' | grep -i Ciphers | sed s'/-o//g'
      args:
        executable: "{{ rhel8stig_shell_executable }}"
      changed_when: false
      check_mode: false
      register: discovered_current_ciphers

    - name: "HIGH | RHEL-08-010291 | PATCH | The RHEL 8 SSH server must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH server connections. | Apply Ciphers"
      ansible.builtin.lineinfile:
        path: /etc/crypto-policies/back-ends/opensshserver.config
        regexp: '(^CRYPTO_POLICY=.*)-oCiphers={{ discovered_current_ciphers.stdout }}(.*$)'
        line: '\g<1>-oCiphers={{ rhel8stig_ssh_ciphers }}\g<2>'
        backrefs: true
      notify: Change_requires_reboot

- name: "HIGH | RHEL-08-010296 | PATCH | The RHEL 8 SSH client must be configured to use only DOD-approved Message Authentication Codes (MACs) employing FIPS 140-3-validated cryptographic hash algorithms to protect the confidentiality of SSH client connections. | Add MACs"
  when: rhel8stig_010296
  tags:
    - CAT1
    - RHEL-08-010296
    - CCI-001453
    - NIST800-53R4_AC-17
    - SRG-OS-000250-GPOS-00093
    - SV-272482r1208740_rule
    - V-272482
    - fips
    - sshd
  ansible.builtin.lineinfile:
    path: /etc/crypto-policies/back-ends/openssh.config
    regexp: ^MACs.*
    line: "MACs {{ rhel8stig_ssh_macs }}"
  notify: Change_requires_reboot

- name: "HIGH | RHEL-08-010297 | PATCH | RHEL 8 SSH client must be configured to use only ciphers employing FIPS 140-3 validated cryptographic hash algorithms. | Add Ciphers"
  when: rhel8stig_010297
  tags:
    - CAT1
    - RHEL-08-010297
    - CCI-001453
    - NIST800-53R4_AC-17
    - SRG-OS-000250-GPOS-00093
    - SV-272483r1184243_rule
    - V-272483
    - fips
    - sshd
  ansible.builtin.lineinfile:
    path: /etc/crypto-policies/back-ends/openssh.config
    regexp: ^Ciphers
    line: "Ciphers {{ rhel8stig_ssh_ciphers }}"
  notify: Change_requires_reboot
