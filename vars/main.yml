---

rhel8stig_min_ansible_version: 2.12.1

# Shell interpreter for ansible.builtin.shell tasks that require a shell
# (pipe, glob, &&, or a shell builtin). Explicit + overridable to a POSIX
# shell such as dash or ash for container runs.
rhel8stig_shell_executable: /bin/bash

# RHEL 8 STIG requirements
combined_crypto_policy_config: FIPS

rhel8stig_sysctl_reload: "{{ not system_is_container }}"

# Allow automated discovery of UIDs
discover_int_uid: true

# Used to control warning summary
warn_control_list: ""
warn_count: 0

company_title: 'MindPoint Group - A Tyto Athene Company'

file_managed_by_ansible: |-
  # File managed by ansible as part of {{ benchmark }} benchmark
  # As part of Ansible-lockdown
  # Provided by {{ company_title }}
